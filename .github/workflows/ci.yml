name: RecomSense CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Train and test
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Train the model
        run: python -m model.trainer

      - name: Run the test suite
        run: pytest

  docker:
    name: Build image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - name: Build the RecomSense image
        run: docker build . --file Dockerfile --tag recomsense:${{ github.sha }}
